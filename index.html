<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POINT CLOUD STUDIO</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <!-- Mobile: floating button to open/close the controls panel -->
    <button id="panel-toggle" aria-label="Toggle controls panel">≡</button>

    <div id="sidebar">
      <div id="sidebar-header">
        <div class="header-top">
          <span class="logo">&#11044; PCS</span>
          <span class="version">v1.0.0</span>
        </div>
        <div class="header-sub">POINT CLOUD STUDIO</div>
        <div class="divider"></div>
      </div>

      <div id="sidebar-body">

        <!-- Status readout -->
        <div class="section">
          <div class="section-label">// STATUS</div>
          <div class="status-grid">
            <div class="stat"><span class="stat-label">POINTS</span><span class="stat-value" id="stat-points">0</span></div>
            <div class="stat"><span class="stat-label">EDGES</span><span class="stat-value" id="stat-edges">0</span></div>
            <div class="stat"><span class="stat-label">SEED</span><span class="stat-value" id="stat-seed">—</span></div>
            <div class="stat"><span class="stat-label">FPS</span><span class="stat-value" id="stat-fps">—</span></div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Cloud geometry -->
        <div class="section">
          <div class="section-label">// GEOMETRY</div>

          <div class="control-row">
            <label>CLOUD STYLE</label>
            <div class="mode-group">
              <button class="btn mode-btn mode-active" id="mode-organic">ORGANIC</button>
              <button class="btn mode-btn" id="mode-structural">STRUCT</button>
              <button class="btn mode-btn" id="mode-image">IMAGE</button>
            </div>
            <div class="mode-group" style="margin-top:4px">
              <button class="btn mode-btn" id="mode-crystal">CRYSTAL</button>
              <button class="btn mode-btn" id="mode-terrain">TERRAIN</button>
              <button class="btn mode-btn" id="mode-fractal">FRACTAL</button>
              <button class="btn mode-btn" id="mode-galaxy">GALAXY</button>
            </div>
          </div>

          <div class="control-row">
            <label>COLOR THEME</label>
            <div class="mode-group">
              <button class="btn mode-btn mode-active" id="theme-cityscan">CITY</button>
              <button class="btn mode-btn" id="theme-cosmic">COSMIC</button>
              <button class="btn mode-btn" id="theme-bio">BIO</button>
            </div>
            <div class="mode-group" style="margin-top:4px">
              <button class="btn mode-btn" id="theme-infrared">HEAT</button>
              <button class="btn mode-btn" id="theme-mono">MONO</button>
              <button class="btn mode-btn" id="theme-sunset">SUNSET</button>
            </div>
          </div>

          <div class="control-row">
            <label>POINT COUNT</label>
            <div class="input-row">
              <input type="range" id="pointCount" min="50" max="3000" step="50" value="800" />
              <span class="val" id="pointCount-val">800</span>
            </div>
          </div>

          <div class="control-row">
            <label>CLOUD RADIUS</label>
            <div class="input-row">
              <input type="range" id="cloudRadius" min="5" max="80" step="1" value="30" />
              <span class="val" id="cloudRadius-val">30</span>
            </div>
          </div>

          <div class="control-row">
            <label>NOISE SCALE</label>
            <div class="input-row">
              <input type="range" id="noiseScale" min="0.01" max="2.0" step="0.01" value="0.35" />
              <span class="val" id="noiseScale-val">0.35</span>
            </div>
          </div>

          <div class="control-row">
            <label>NOISE STRENGTH</label>
            <div class="input-row">
              <input type="range" id="noiseStrength" min="0" max="1" step="0.01" value="0.55" />
              <span class="val" id="noiseStrength-val">0.55</span>
            </div>
          </div>

          <div class="control-row">
            <label>POINT SIZE</label>
            <div class="input-row">
              <input type="range" id="pointSize" min="0.1" max="8" step="0.05" value="2.0" />
              <span class="val" id="pointSize-val">2.0</span>
            </div>
          </div>
        </div>

        <!-- Style-specific options (shown contextually based on active cloud style) -->
        <div id="style-opts-panel" style="display:none">
          <div class="divider"></div>
          <div class="section">
            <div class="section-label">// STYLE OPTIONS</div>

            <div id="style-opts-galaxy" style="display:none">
              <div class="control-row">
                <label>SPIRAL ARMS</label>
                <div class="input-row">
                  <input type="range" id="galaxyArms" min="1" max="6" step="1" value="3" />
                  <span class="val" id="galaxyArms-val">3</span>
                </div>
              </div>
            </div>

            <div id="style-opts-terrain" style="display:none">
              <div class="control-row">
                <label>STRATA BANDS</label>
                <div class="input-row">
                  <input type="range" id="terrainStrata" min="2" max="10" step="1" value="5" />
                  <span class="val" id="terrainStrata-val">5</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Image source controls (shown only when IMAGE mode active) -->
        <div id="image-controls" style="display:none">
          <div class="divider"></div>
          <div class="section">
            <div class="section-label">// IMAGE SOURCE</div>

            <div class="control-row">
              <label>UPLOAD IMAGE</label>
              <div class="input-row">
                <input type="file" id="imageUpload" accept="image/*" style="display:none" />
                <button id="btn-image-upload" class="btn btn-secondary" style="flex:1">&#9651; LOAD FILE</button>
                <span class="val" id="image-filename" style="font-size:8px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
              </div>
            </div>

            <div class="control-row">
              <label>MAP MODE</label>
              <div class="mode-group">
                <button class="btn mode-btn mode-active" id="mapmode-height">HEIGHT</button>
                <button class="btn mode-btn" id="mapmode-density">DENSITY</button>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Connections -->
        <div class="section">
          <div class="section-label">
            // NETWORK
            <label class="toggle-label">
              <input type="checkbox" id="connectionsEnabled" checked />
              <span class="toggle-text" id="connections-toggle-text">ON</span>
            </label>
          </div>

          <div id="connections-controls">
            <div class="control-row">
              <label>MAX DISTANCE</label>
              <div class="input-row">
                <input type="range" id="connectionDist" min="1" max="30" step="0.5" value="8" />
                <span class="val" id="connectionDist-val">8.0</span>
              </div>
            </div>

            <div class="control-row">
              <label>LINE OPACITY</label>
              <div class="input-row">
                <input type="range" id="lineOpacity" min="0.02" max="1" step="0.01" value="0.25" />
                <span class="val" id="lineOpacity-val">0.25</span>
              </div>
            </div>

            <div class="control-row">
              <label>LINE WIDTH</label>
              <div class="input-row">
                <input type="range" id="lineWidth" min="0.1" max="2" step="0.05" value="0.5" />
                <span class="val" id="lineWidth-val">0.50</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Auto-spin animation -->
        <div class="section">
          <div class="section-label">
            // AUTO-SPIN
            <label class="toggle-label">
              <input type="checkbox" id="autoSpin" />
              <span class="toggle-text" id="autoSpin-text">OFF</span>
            </label>
          </div>

          <div id="spin-controls">
            <div class="control-row">
              <label>SPIN SPEED</label>
              <div class="input-row">
                <input type="range" id="spinSpeed" min="0.05" max="2.0" step="0.05" value="0.4" />
                <span class="val" id="spinSpeed-val">0.40</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Drift animation -->
        <div class="section">
          <div class="section-label">
            // DRIFT
            <label class="toggle-label">
              <input type="checkbox" id="driftEnabled" checked />
              <span class="toggle-text" id="drift-toggle-text">ON</span>
            </label>
          </div>

          <div id="drift-controls">
            <div class="control-row">
              <label>DRIFT SPEED</label>
              <div class="input-row">
                <input type="range" id="driftSpeed" min="0.01" max="0.5" step="0.005" value="0.08" />
                <span class="val" id="driftSpeed-val">0.080</span>
              </div>
            </div>

            <div class="control-row">
              <label>DRIFT AMPLITUDE</label>
              <div class="input-row">
                <input type="range" id="driftAmp" min="0.1" max="5" step="0.1" value="1.2" />
                <span class="val" id="driftAmp-val">1.2</span>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Actions -->
        <div class="section">
          <div class="section-label">// ACTIONS</div>
          <div class="btn-group">
            <button id="btn-regenerate" class="btn btn-primary">&#9646; REGENERATE</button>
            <button id="btn-screenshot" class="btn btn-secondary">&#9642; SCREENSHOT</button>
          </div>
          <div class="btn-group" style="margin-top:6px">
            <button id="btn-share" class="btn btn-secondary">&#11208; SHARE URL</button>
          </div>
          <div class="control-row" style="margin-top:10px">
            <label>SEED</label>
            <div class="input-row seed-row">
              <input type="number" id="seedInput" min="0" max="99999" value="42" />
              <button id="btn-random-seed" class="btn btn-ghost">RND</button>
            </div>
          </div>
        </div>

      </div>

      <div id="sidebar-footer">
        <div class="divider"></div>
        <div class="footer-text">
          <span class="hint-desktop">ORBIT · PAN · SCROLL ZOOM</span>
          <span class="hint-mobile">DRAG · PINCH ZOOM</span>
        </div>
      </div>
    </div>

    <!-- Hover tooltip -->
    <div id="hover-tooltip"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
